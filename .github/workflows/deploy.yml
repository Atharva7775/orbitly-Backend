name: build-and-deploy

on:
  push:
    branches: [main, prod-eu, staging, qa]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/orbitly-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.4
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Roll out API and workers
        # orbitly-backend runs `python -m app.migrate` as an init container, so
        # migrations/*.sql are applied before the new API pods take traffic.
        run: |
          kubectl -n orbitly set image deployment/orbitly-backend \
            migrate=${{ env.IMAGE }}:${{ needs.image.outputs.tag }} \
            backend=${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
          kubectl -n orbitly set image deployment/orbitly-worker \
            worker=${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
          kubectl -n orbitly rollout status deployment/orbitly-backend --timeout=300s
          kubectl -n orbitly rollout status deployment/orbitly-worker --timeout=180s
